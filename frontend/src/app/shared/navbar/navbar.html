<header class="flex flex-wrap items-center gap-x-6 gap-y-4 border-b border-[#2A3140] bg-[#0D1017] px-12 py-4">
  <a routerLink="/" class="flex items-center gap-2.5 font-display text-2xl font-bold text-[#EEF1F6]">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <path d="M9.8 10L12 18M18.5 9.5L15.5 18M10.5 8h7" stroke="#6B7587" stroke-width="1.5" />
      <circle cx="7" cy="8" r="3.5" fill="#38D0B9" />
      <circle cx="21" cy="7" r="3.5" fill="#FF5A5F" />
      <circle cx="14" cy="21" r="3.5" fill="#EEF1F6" />
    </svg>
    <span>Neo4<span class="text-[#FF5A5F]">flix</span></span>
  </a>

  <nav class="flex flex-1 flex-wrap gap-1">
    <a routerLink="/" class="inline-flex min-h-11 items-center rounded-lg px-3.5 text-sm font-medium text-[#C9D0DC] hover:text-white">Home</a>
    <a routerLink="/search" class="inline-flex min-h-11 items-center rounded-lg px-3.5 text-sm font-medium text-[#C9D0DC] hover:text-white">Browse</a>
    <a routerLink="/recommendations" class="inline-flex min-h-11 items-center rounded-lg px-3.5 text-sm font-medium text-[#C9D0DC] hover:text-white">For you</a>
    <a routerLink="/my-list" class="inline-flex min-h-11 items-center rounded-lg px-3.5 text-sm font-medium text-[#C9D0DC] hover:text-white">My list</a>
  </nav>

  <div class="flex items-center gap-4">
    <a
      routerLink="/profile"
      aria-label="Your profile"
      aria-current="page"
      class="flex h-11 w-11 items-center justify-center rounded-full bg-[#38D0B9] text-[15px] font-bold text-[#0D1017] shadow-[0_0_0_2px_#0D1017,0_0_0_4px_#38D0B9]"
    >
      {{ initials() }}
    </a>
    <a routerLink="/login" (click)="onSignOut()" class="inline-flex min-h-11 items-center rounded-lg border border-[#5B6579] px-4 text-sm font-medium text-[#EEF1F6]">
      Sign out
    </a>
  </div>
</header>
