<header class="flex flex-wrap items-center gap-x-6 gap-y-4 border-b border-[#2A3140] bg-[#0D1017] px-12 py-4">
  <a routerLink="/" class="flex items-center gap-2.5 font-display text-2xl font-bold text-[#EEF1F6]">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <path d="M9.8 10L12 18M18.5 9.5L15.5 18M10.5 8h7" stroke="#6B7587" stroke-width="1.5" />
      <circle cx="7" cy="8" r="3.5" fill="#38D0B9" />
      <circle cx="21" cy="7" r="3.5" fill="#FF5A5F" />
      <circle cx="14" cy="21" r="3.5" fill="#EEF1F6" />
    </svg>
    <span>Neo4<span class="text-[#FF5A5F]">flix</span></span>
  </a>

  <nav class="flex flex-1 flex-wrap gap-1">
    <a
      routerLink="/"
      routerLinkActive="bg-[#1C222D] text-white"
      [routerLinkActiveOptions]="{ exact: true }"
      class="inline-flex min-h-11 items-center rounded-lg px-3.5 text-sm font-medium text-[#C9D0DC] hover:text-white"
      >Home</a
    >
    <a
      routerLink="/search"
      routerLinkActive="bg-[#1C222D] text-white"
      class="inline-flex min-h-11 items-center rounded-lg px-3.5 text-sm font-medium text-[#C9D0DC] hover:text-white"
      >Browse</a
    >
    <a
      routerLink="/recommendations"
      routerLinkActive="bg-[#1C222D] text-white"
      class="inline-flex min-h-11 items-center rounded-lg px-3.5 text-sm font-medium text-[#C9D0DC] hover:text-white"
      >For you</a
    >
    <a
      routerLink="/my-list"
      routerLinkActive="bg-[#1C222D] text-white"
      class="inline-flex min-h-11 items-center rounded-lg px-3.5 text-sm font-medium text-[#C9D0DC] hover:text-white"
      >My list</a
    >
  </nav>

  <div class="relative">
    <input
      type="text"
      placeholder="Search users..."
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearchChange()"
      (focus)="onSearchFocus()"
      (blur)="onSearchBlur()"
      class="h-11 w-56 rounded-lg border border-[#2A3140] bg-[#151A23] px-3.5 text-sm text-[#EEF1F6] placeholder:text-[#6B7587] focus:outline-none focus:border-[#5B6579]"
    />

    @if (showResults()) {
      <div class="absolute top-[calc(100%+6px)] left-0 z-10 w-72 overflow-hidden rounded-lg border border-[#2A3140] bg-[#151A23] shadow-lg">
        @if (isSearching()) {
          <p class="m-0 px-3.5 py-3 text-sm text-[#A0A9B8]">Searching...</p>
        } @else if (searchResults().length === 0) {
          <p class="m-0 px-3.5 py-3 text-sm text-[#A0A9B8]">No users found.</p>
        } @else {
          @for (user of searchResults(); track user.id) {
            <button
              type="button"
              (mousedown)="goToUser(user)"
              class="flex w-full cursor-pointer items-center gap-3 px-3.5 py-2.5 text-left hover:bg-[#1C222D]"
            >
              <span class="flex h-8 w-8 flex-none items-center justify-center rounded-full bg-[#38D0B9] text-xs font-bold text-[#0D1017]">
                {{ (user.firstName[0] ?? user.username[0] ?? '?').toUpperCase() }}
              </span>
              <span class="flex min-w-0 flex-col">
                <span class="truncate text-sm font-medium text-[#EEF1F6]">{{ user.firstName }} {{ user.lastName }}</span>
                <span class="truncate text-xs text-[#A0A9B8]">&#64;{{ user.username }}</span>
              </span>
              @if (user.isFriend) {
                <span class="ml-auto flex-none text-xs text-[#38D0B9]">Friend</span>
              }
            </button>
          }
        }
      </div>
    }
  </div>

  <div class="flex items-center gap-4">
    @if (isAdmin()) {
      <button
        type="button"
        (click)="showAddMovieModal.set(true)"
        class="inline-flex min-h-11 cursor-pointer items-center rounded-[10px] border-0 bg-[#FF5A5F] px-4 text-sm font-semibold text-[#0D1017]"
      >
        + Add Movie
      </button>
    }
    <a
      [routerLink]="['/', userId() ?? '']"
      aria-label="Your profile"
      aria-current="page"
      class="flex h-11 w-11 items-center justify-center rounded-full bg-[#38D0B9] text-[15px] font-bold text-[#0D1017] shadow-[0_0_0_2px_#0D1017,0_0_0_4px_#38D0B9]"
    >
      {{ initials() }}
    </a>
    <a routerLink="/login" (click)="onSignOut()" class="inline-flex min-h-11 items-center rounded-lg border border-[#5B6579] px-4 text-sm font-medium text-[#EEF1F6]">
      Sign out
    </a>
  </div>
</header>

@if (showAddMovieModal()) {
  <app-add-movie-modal (closed)="onMovieModalClosed()" />
}
